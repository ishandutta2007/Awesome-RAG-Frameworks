<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814" />
      <stop offset="50%" stop-color="#0b112c" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>

    <!-- Vibrant Text Gradient -->
    <linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="30%" stop-color="#818cf8" />
      <stop offset="70%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <!-- Accent Line Gradients -->
    <linearGradient id="flowGradient1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="flowGradient2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#ec4899" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.1" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
    </filter>

    <style>
      .glow-orb-1 {
        animation: pulse1 6s ease-in-out infinite alternate;
      }
      .glow-orb-2 {
        animation: pulse2 8s ease-in-out infinite alternate;
      }
      .flow-line {
        stroke-dasharray: 8 16;
        animation: streamFlow 25s linear infinite;
      }
      .flow-line-reverse {
        stroke-dasharray: 6 12;
        animation: streamFlowReverse 20s linear infinite;
      }
      .pill-float-1 {
        animation: floatY1 4s ease-in-out infinite alternate;
      }
      .pill-float-2 {
        animation: floatY2 5s ease-in-out infinite alternate;
      }
      .pill-float-3 {
        animation: floatY3 4.5s ease-in-out infinite alternate;
      }
      .pill-float-4 {
        animation: floatY4 5.5s ease-in-out infinite alternate;
      }
      .node-pulse {
        animation: nodePulse 3s ease-in-out infinite;
      }

      @keyframes pulse1 {
        0% { transform: translate(0, 0) scale(1); opacity: 0.35; }
        100% { transform: translate(40px, 20px) scale(1.2); opacity: 0.6; }
      }
      @keyframes pulse2 {
        0% { transform: translate(0, 0) scale(1); opacity: 0.25; }
        100% { transform: translate(-30px, -25px) scale(1.15); opacity: 0.55; }
      }
      @keyframes streamFlow {
        from { stroke-dashoffset: 400; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes streamFlowReverse {
        from { stroke-dashoffset: 0; }
        to { stroke-dashoffset: 400; }
      }
      @keyframes floatY1 {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-7px); }
      }
      @keyframes floatY2 {
        0% { transform: translateY(0px); }
        100% { transform: translateY(8px); }
      }
      @keyframes floatY3 {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-6px); }
      }
      @keyframes floatY4 {
        0% { transform: translateY(0px); }
        100% { transform: translateY(7px); }
      }
      @keyframes nodePulse {
        0%, 100% { r: 4px; opacity: 0.6; }
        50% { r: 6.5px; opacity: 1; }
      }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGradient)" />

  <!-- Subtle Grid Pattern -->
  <g opacity="0.08" stroke="#94a3b8" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="150" y1="0" x2="150" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="450" y1="0" x2="450" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="750" y1="0" x2="750" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
    <line x1="1050" y1="0" x2="1050" y2="360" />
  </g>

  <!-- Animated Glowing Ambience Orbs (Behind text) -->
  <g filter="url(#softGlow)">
    <circle class="glow-orb-1" cx="240" cy="90" r="140" fill="#6366f1" />
    <circle class="glow-orb-2" cx="960" cy="270" r="160" fill="#06b6d4" />
    <circle class="glow-orb-1" cx="880" cy="80" r="120" fill="#ec4899" />
  </g>

  <!-- Dynamic Data Pipeline Flow Streams -->
  <g opacity="0.6">
    <path class="flow-line" d="M -20,70 Q 300,10 600,60 T 1220,50" fill="none" stroke="url(#flowGradient1)" stroke-width="2.5" />
    <path class="flow-line-reverse" d="M -20,310 Q 350,340 700,290 T 1220,320" fill="none" stroke="url(#flowGradient2)" stroke-width="2.5" />
    <path class="flow-line" d="M 50,180 C 250,220 350,140 550,180 S 850,230 1150,170" fill="none" stroke="#8b5cf6" stroke-width="1.5" opacity="0.3" />
  </g>

  <!-- Floating Pipeline Node Dots -->
  <g fill="#38bdf8">
    <circle class="node-pulse" cx="220" cy="65" r="5" />
    <circle class="node-pulse" cx="600" cy="60" r="5" fill="#a855f7" />
    <circle class="node-pulse" cx="980" cy="53" r="5" fill="#f43f5e" />
    <circle class="node-pulse" cx="350" cy="305" r="5" fill="#38bdf8" />
    <circle class="node-pulse" cx="700" cy="290" r="5" fill="#10b981" />
    <circle class="node-pulse" cx="1060" cy="316" r="5" fill="#ec4899" />
  </g>

  <!-- Animated Architectural Tech Badges (Floating on margins) -->
  <!-- Top Left Pill -->
  <g class="pill-float-1" transform="translate(60, 35)">
    <rect width="136" height="30" rx="15" fill="#1e293b" fill-opacity="0.85" stroke="#38bdf8" stroke-width="1" />
    <circle cx="16" cy="15" r="4" fill="#38bdf8" />
    <text x="28" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#94a3b8" letter-spacing="0.5">HYBRID SEARCH</text>
  </g>

  <!-- Top Right Pill -->
  <g class="pill-float-2" transform="translate(1000, 35)">
    <rect width="140" height="30" rx="15" fill="#1e293b" fill-opacity="0.85" stroke="#a855f7" stroke-width="1" />
    <circle cx="16" cy="15" r="4" fill="#c084fc" />
    <text x="28" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#94a3b8" letter-spacing="0.5">GRAPHRAG CORE</text>
  </g>

  <!-- Bottom Left Pill -->
  <g class="pill-float-3" transform="translate(60, 295)">
    <rect width="150" height="30" rx="15" fill="#1e293b" fill-opacity="0.85" stroke="#10b981" stroke-width="1" />
    <circle cx="16" cy="15" r="4" fill="#34d399" />
    <text x="28" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#94a3b8" letter-spacing="0.5">RERANKING &amp; CHUNK</text>
  </g>

  <!-- Bottom Right Pill -->
  <g class="pill-float-4" transform="translate(990, 295)">
    <rect width="150" height="30" rx="15" fill="#1e293b" fill-opacity="0.85" stroke="#f472b6" stroke-width="1" />
    <circle cx="16" cy="15" r="4" fill="#fb7185" />
    <text x="28" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#94a3b8" letter-spacing="0.5">AGENTIC PIPELINES</text>
  </g>

  <!-- Foreground Title and Subtitle (Ensured high contrast and foreground prominence) -->
  <g transform="translate(600, 160)" text-anchor="middle">
    <!-- Category Mini-Header Pill -->
    <g transform="translate(-140, -68)">
      <rect width="280" height="26" rx="13" fill="#1e1b4b" fill-opacity="0.9" stroke="#6366f1" stroke-width="1" />
      <text x="140" y="17" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#a5b4fc" letter-spacing="2">ENTERPRISE &amp; OPEN SOURCE</text>
    </g>

    <!-- Main Title -->
    <text y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="46" font-weight="900" letter-spacing="-1" fill="url(#titleGradient)" filter="url(#glow)">
      Awesome RAG Frameworks
    </text>

    <!-- Subtitle -->
    <text y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500" fill="#cbd5e1" letter-spacing="0.4">
      Curated Ecosystem of Retrieval Pipelines, Vector Stores &amp; Production LLM Orchestration
    </text>

    <!-- Metadata Badges line in banner -->
    <g transform="translate(0, 82)">
      <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#64748b" letter-spacing="1.2">
        RETRIEVAL ABSTRACTIONS  •  TYPED PIPELINES  •  HYBRID RETRIEVAL  •  BENCHMARKS
      </text>
    </g>
  </g>

  <!-- Border Highlight -->
  <rect width="1198" height="358" x="1" y="1" rx="15" fill="none" stroke="#334155" stroke-width="1.5" opacity="0.6" />
</svg>
